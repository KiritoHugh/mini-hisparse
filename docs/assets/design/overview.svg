<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
<title id="title">逻辑选择与两级存储</title>
<desc id="desc">上方为四步计算链；下方为独立 host 与共享 GPU 池。</desc>
<rect width="900" height="250" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<rect x="15" y="15" width="180" height="56" rx="7" fill="#f3f5f7" stroke="#b2bdc8" stroke-width="1.4"/>
<text x="105.0" y="50.0" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">逻辑选择</text>
<rect x="245" y="15" width="180" height="56" rx="7" fill="#f3f5f7" stroke="#b2bdc8" stroke-width="1.4"/>
<text x="335.0" y="50.0" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">地址解析</text>
<rect x="475" y="15" width="180" height="56" rx="7" fill="#f3f5f7" stroke="#b2bdc8" stroke-width="1.4"/>
<text x="565.0" y="50.0" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">缺失行加载</text>
<rect x="705" y="15" width="180" height="56" rx="7" fill="#eaf0f8" stroke="#7d9ab8" stroke-width="1.4"/>
<text x="795.0" y="50.0" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">Attention</text>
<polyline points="195,43 245,43" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="245,43 237.0,47.0 237.0,39.0" fill="#607184"/>
<polyline points="425,43 475,43" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="475,43 467.0,47.0 467.0,39.0" fill="#607184"/>
<polyline points="655,43 705,43" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="705,43 697.0,47.0 697.0,39.0" fill="#607184"/>
<text x="450" y="107" text-anchor="middle" font-size="19" font-weight="400" fill="#607184">只为本步所选数据解析地址与准备落点</text>
<rect x="15" y="139" width="245" height="92" rx="7" fill="#faf1e1" stroke="#c8ab73" stroke-width="1.4"/>
<text x="137.5" y="178.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">Host backing</text>
<text x="137.5" y="205.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">保存完整逻辑历史</text>
<rect x="280" y="126" width="605" height="114" rx="7" fill="#ffffff" stroke="#96a4b3" stroke-width="1.4"/>
<text x="582" y="151" text-anchor="middle" font-size="19" font-weight="500" fill="#20344a">同一个 GPU KV tensor</text>
<rect x="297" y="165" width="270" height="59" rx="7" fill="#eaf0f8" stroke="#7d9ab8" stroke-width="1.4"/>
<text x="432.0" y="201.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">Resident · 驻留完整页</text>
<rect x="587" y="165" width="280" height="59" rx="7" fill="#e7f3ee" stroke="#76a18f" stroke-width="1.4"/>
<text x="727.0" y="201.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">Hot · 缓存选中行</text>
</g></svg>
