<svg xmlns="http://www.w3.org/2000/svg" width="900" height="237" viewBox="0 0 900 237" role="img" aria-labelledby="title desc">
<title id="title">三条地址解析路径</title>
<desc id="desc">优先 resident，随后 hot tag，最后才分配 miss 落点并加载。</desc>
<rect width="900" height="237" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="12" y="51" text-anchor="start" font-size="19" font-weight="500" fill="#20344a">Resident hit</text>
<rect x="170" y="15" width="242" height="57" rx="7" fill="#eaf0f8" stroke="#7d9ab8" stroke-width="1.4"/>
<text x="291.0" y="50.15" text-anchor="middle" font-size="19" font-weight="400" fill="#20344a">resident[p] = b</text>
<polyline points="412,43 447,43" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="447,43 439.0,47.0 439.0,39.0" fill="#607184"/>
<rect x="447" y="15" width="245" height="57" rx="7" fill="#eaf0f8" stroke="#7d9ab8" stroke-width="1.4"/>
<text x="569.5" y="50.15" text-anchor="middle" font-size="19" font-weight="400" fill="#20344a">b × P + offset</text>
<polyline points="692,43 727,43" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="727,43 719.0,47.0 719.0,39.0" fill="#607184"/>
<rect x="727" y="15" width="160" height="57" rx="7" fill="#eaf0f8" stroke="#7d9ab8" stroke-width="1.4"/>
<text x="807.0" y="50.15" text-anchor="middle" font-size="19" font-weight="400" fill="#20344a">直接可读</text>
<text x="12" y="127" text-anchor="start" font-size="19" font-weight="500" fill="#20344a">Hot hit</text>
<rect x="170" y="91" width="242" height="57" rx="7" fill="#e7f3ee" stroke="#76a18f" stroke-width="1.4"/>
<text x="291.0" y="126.15" text-anchor="middle" font-size="19" font-weight="400" fill="#20344a">source[p] → host row</text>
<polyline points="412,119 447,119" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="447,119 439.0,123.0 439.0,115.0" fill="#607184"/>
<rect x="447" y="91" width="245" height="57" rx="7" fill="#e7f3ee" stroke="#76a18f" stroke-width="1.4"/>
<text x="569.5" y="126.15" text-anchor="middle" font-size="19" font-weight="400" fill="#20344a">tag → hot slot</text>
<polyline points="692,119 727,119" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="727,119 719.0,123.0 719.0,115.0" fill="#607184"/>
<rect x="727" y="91" width="160" height="57" rx="7" fill="#e7f3ee" stroke="#76a18f" stroke-width="1.4"/>
<text x="807.0" y="126.15" text-anchor="middle" font-size="19" font-weight="400" fill="#20344a">直接可读</text>
<text x="12" y="203" text-anchor="start" font-size="19" font-weight="500" fill="#20344a">Miss</text>
<rect x="170" y="167" width="242" height="57" rx="7" fill="#faf1e1" stroke="#c8ab73" stroke-width="1.4"/>
<text x="291.0" y="202.15" text-anchor="middle" font-size="19" font-weight="400" fill="#20344a">source[p] → host row</text>
<polyline points="412,195 447,195" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="447,195 439.0,199.0 439.0,191.0" fill="#607184"/>
<rect x="447" y="167" width="245" height="57" rx="7" fill="#faf1e1" stroke="#c8ab73" stroke-width="1.4"/>
<text x="569.5" y="202.15" text-anchor="middle" font-size="19" font-weight="400" fill="#20344a">分配 slot + gather</text>
<polyline points="692,195 727,195" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="727,195 719.0,199.0 719.0,191.0" fill="#607184"/>
<rect x="727" y="167" width="160" height="57" rx="7" fill="#faf1e1" stroke="#c8ab73" stroke-width="1.4"/>
<text x="807.0" y="202.15" text-anchor="middle" font-size="19" font-weight="400" fill="#20344a">ready 后可读</text>
</g></svg>
