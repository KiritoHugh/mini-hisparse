<svg xmlns="http://www.w3.org/2000/svg" width="900" height="278" viewBox="0 0 900 278" role="img" aria-labelledby="title desc">
<title id="title">页回收与临时行就绪</title>
<desc id="desc">页经历 dirty、clean、reclaimable、host-only；hot 行单独经历分配、加载和就绪。</desc>
<rect width="900" height="278" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="12" y="25" text-anchor="start" font-size="20" font-weight="500" fill="#20344a">逻辑页：是否仍拥有 resident 映射</text>
<rect x="12" y="63" width="162" height="70" rx="7" fill="#eaf0f8" stroke="#7d9ab8" stroke-width="1.4"/>
<text x="93.0" y="90.8" text-anchor="middle" font-size="18" font-weight="400" fill="#20344a">Dirty</text>
<text x="93.0" y="117.8" text-anchor="middle" font-size="18" font-weight="400" fill="#20344a">GPU 原件受保护</text>
<rect x="250" y="63" width="162" height="70" rx="7" fill="#eaf0f8" stroke="#7d9ab8" stroke-width="1.4"/>
<text x="331.0" y="90.8" text-anchor="middle" font-size="18" font-weight="400" fill="#20344a">Clean</text>
<text x="331.0" y="117.8" text-anchor="middle" font-size="18" font-weight="400" fill="#20344a">host 镜像已完成</text>
<rect x="488" y="63" width="162" height="70" rx="7" fill="#eaf0f8" stroke="#7d9ab8" stroke-width="1.4"/>
<text x="569.0" y="90.8" text-anchor="middle" font-size="18" font-weight="400" fill="#20344a">Reclaimable</text>
<text x="569.0" y="117.8" text-anchor="middle" font-size="18" font-weight="400" fill="#20344a">仍可直接命中</text>
<rect x="726" y="63" width="162" height="70" rx="7" fill="#faf1e1" stroke="#c8ab73" stroke-width="1.4"/>
<text x="807.0" y="90.8" text-anchor="middle" font-size="18" font-weight="400" fill="#20344a">Host-only</text>
<text x="807.0" y="117.8" text-anchor="middle" font-size="18" font-weight="400" fill="#20344a">resident = −1</text>
<text x="212" y="54" text-anchor="middle" font-size="17" font-weight="400" fill="#607184">镜像完成</text>
<polyline points="174,98 250,98" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="250,98 242.0,102.0 242.0,94.0" fill="#607184"/>
<text x="450" y="54" text-anchor="middle" font-size="17" font-weight="400" fill="#607184">资格满足</text>
<polyline points="412,98 488,98" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="488,98 480.0,102.0 480.0,94.0" fill="#607184"/>
<text x="688" y="54" text-anchor="middle" font-size="17" font-weight="400" fill="#607184">实际复用</text>
<polyline points="650,98 726,98" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="726,98 718.0,102.0 718.0,94.0" fill="#607184"/>
<text x="12" y="181" text-anchor="start" font-size="20" font-weight="500" fill="#20344a">Hot 行：只改变副本，不改变逻辑页状态</text>
<rect x="12" y="204" width="220" height="57" rx="7" fill="#e7f3ee" stroke="#76a18f" stroke-width="1.4"/>
<text x="122.0" y="239.15" text-anchor="middle" font-size="19" font-weight="400" fill="#20344a">旧副本 / 空 slot</text>
<rect x="340" y="204" width="220" height="57" rx="7" fill="#e7f3ee" stroke="#76a18f" stroke-width="1.4"/>
<text x="450.0" y="239.15" text-anchor="middle" font-size="19" font-weight="400" fill="#20344a">新 tag · loading</text>
<rect x="668" y="204" width="220" height="57" rx="7" fill="#e7f3ee" stroke="#76a18f" stroke-width="1.4"/>
<text x="778.0" y="239.15" text-anchor="middle" font-size="19" font-weight="400" fill="#20344a">Ready · 可读</text>
<polyline points="232,232 340,232" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="340,232 332.0,236.0 332.0,228.0" fill="#607184"/>
<text x="286" y="219" text-anchor="middle" font-size="17" font-weight="400" fill="#607184">分配</text>
<polyline points="560,232 668,232" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="668,232 660.0,236.0 660.0,228.0" fill="#607184"/>
<text x="614" y="219" text-anchor="middle" font-size="17" font-weight="400" fill="#607184">加载完成</text>
</g></svg>
