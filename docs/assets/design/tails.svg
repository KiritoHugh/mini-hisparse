<svg xmlns="http://www.w3.org/2000/svg" width="900" height="251" viewBox="0 0 900 251" role="img" aria-labelledby="title desc">
<title id="title">三块显存中的尾页轮转</title>
<desc id="desc">N=12 时保护 p1、p2；追加 t12 后保护 p2、p3，原 B1 安全复用。</desc>
<rect width="900" height="251" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="14" y="55" text-anchor="start" font-size="20" font-weight="500" fill="#20344a">追加前</text>
<text x="14" y="83" text-anchor="start" font-size="19" font-weight="400" fill="#607184">N = 12</text>
<text x="14" y="187" text-anchor="start" font-size="20" font-weight="500" fill="#20344a">追加 t12 后</text>
<text x="14" y="215" text-anchor="start" font-size="19" font-weight="400" fill="#607184">N = 13</text>
<rect x="170" y="26" width="210" height="80" rx="7" fill="#e7f3ee" stroke="#76a18f" stroke-width="1.4"/>
<text x="275.0" y="59.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">B0 · Hot</text>
<text x="275.0" y="86.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">4 个可替换 rows</text>
<rect x="410" y="26" width="210" height="80" rx="7" fill="#eaf0f8" stroke="#7d9ab8" stroke-width="1.4"/>
<text x="515.0" y="59.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">B1 · Resident p1</text>
<text x="515.0" y="86.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">t4 … t7</text>
<rect x="650" y="26" width="235" height="80" rx="7" fill="#eaf0f8" stroke="#7d9ab8" stroke-width="1.4"/>
<text x="767.5" y="59.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">B2 · Resident p2</text>
<text x="767.5" y="86.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">t8 … t11</text>
<rect x="170" y="158" width="210" height="80" rx="7" fill="#e7f3ee" stroke="#76a18f" stroke-width="1.4"/>
<text x="275.0" y="191.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">B0 · Hot</text>
<text x="275.0" y="218.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">落点保持可用</text>
<rect x="410" y="158" width="210" height="80" rx="7" fill="#eaf0f8" stroke="#7d9ab8" stroke-width="1.4"/>
<text x="515.0" y="191.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">B1 · Resident p3</text>
<text x="515.0" y="218.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">t12 / 空 / 空 / 空</text>
<rect x="650" y="158" width="235" height="80" rx="7" fill="#eaf0f8" stroke="#7d9ab8" stroke-width="1.4"/>
<text x="767.5" y="191.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">B2 · Resident p2</text>
<text x="767.5" y="218.5" text-anchor="middle" font-size="20" font-weight="400" fill="#20344a">t8 … t11</text>
<polyline points="515,106 515,158" fill="none" stroke="#607184" stroke-width="1.6"/>
<polygon points="515,158 511.0,150.0 519.0,150.0" fill="#607184"/>
<text x="535" y="139" text-anchor="start" font-size="18" font-weight="400" fill="#607184">p1 已安全保存至 host</text>
</g></svg>
